/* ---------------- tiny seeded wobble ----------------------- */
let wob = 0;                      // wobble tick (~6/sec) — boiling-line effect
function jit(seed, i, amp){
  const v = Math.sin(seed * 127.1 + i * 269.5 + wob * 97.31) * 43758.5453;
  return (v - Math.floor(v) - 0.5) * 2 * amp;
}
function rnd(seed, i){ const v = Math.sin(seed*91.7 + i*137.3)*24634.63; return v - Math.floor(v); }

/* ---------------- sketchy pencil renderer ------------------ */
function pencil(alpha, width, color){
  ctx.strokeStyle = color || INK;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}
function sketchLine(x1,y1,x2,y2, seed, amp){
  amp = amp === undefined ? 1.6 : amp;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy);
  const n = Math.max(2, Math.ceil(len/16));
  for(let pass=0; pass<2; pass++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const t = i/n;
      const px = x1 + dx*t + jit(seed+pass*7, i, amp);
      const py = y1 + dy*t + jit(seed+pass*7+3, i, amp);
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    const ga = ctx.globalAlpha;
    if(pass===1) ctx.globalAlpha = ga*0.35;
    ctx.stroke();
    ctx.globalAlpha = ga;
  }
}
function sketchCircle(x,y,r, seed, amp){
  amp = amp === undefined ? Math.min(2.2, r*0.09) : amp;
  const n = Math.max(10, Math.ceil(r*0.7));
  for(let pass=0; pass<2; pass++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a = (i/n) * Math.PI*2 - 0.35;   // start/end overlap gap feel
      const rr = r + jit(seed+pass*11, i, amp);
      const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    const ga = ctx.globalAlpha;
    if(pass===1) ctx.globalAlpha = ga*0.3;
    ctx.stroke();
    ctx.globalAlpha = ga;
  }
}
function sketchRect(x,y,w,h, seed){
  sketchLine(x,y, x+w,y, seed);
  sketchLine(x+w,y, x+w,y+h, seed+1);
  sketchLine(x+w,y+h, x,y+h, seed+2);
  sketchLine(x,y+h, x,y, seed+3);
}
/* colored-pencil hatch fill inside a rect */
function hatchRect(x,y,w,h,color,alpha){
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.globalAlpha = alpha*0.35; ctx.fillStyle = color; ctx.fillRect(x,y,w,h);
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let i=-h; i<w; i+=7){
    ctx.moveTo(x+i, y+h); ctx.lineTo(x+i+h, y);
  }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}
function hatchCircle(x,y,r,color,alpha){
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
  ctx.globalAlpha = alpha*0.3; ctx.fillStyle = color; ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.globalAlpha = alpha*0.9; ctx.strokeStyle = color; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for(let i=-2*r; i<r*2; i+=6){ ctx.moveTo(x-r+i, y+r); ctx.lineTo(x-r+i+2*r, y-r); }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}
/* handwriting text */
function scribbleText(txt, x, y, size, opts){
  opts = opts || {};
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate((opts.rot||0) + jit(txt.length*3+size,0,0.008));
  ctx.font = (opts.bold?'bold ':'') + size + 'px "Comic Sans MS","Chalkboard SE","Segoe Print",cursive';
  ctx.textAlign = opts.align || 'center';
  ctx.textBaseline = 'middle';
  if(opts.outline){
    ctx.lineWidth = size/9; ctx.strokeStyle = '#fbf7ec'; ctx.globalAlpha = 0.9;
    ctx.strokeText(txt, 0, 0);
  }
  ctx.globalAlpha = opts.alpha===undefined?1:opts.alpha;
  ctx.fillStyle = opts.color || INK;
  ctx.fillText(txt, 0, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------------- paper background ------------------------- */
const grain = document.createElement('canvas');
grain.width = W; grain.height = H;
(function makeGrain(){
  const g = grain.getContext('2d');
  for(let i=0;i<2600;i++){
    g.fillStyle = 'rgba(120,110,90,' + (0.02+Math.random()*0.05) + ')';
    g.fillRect(Math.random()*W, Math.random()*H, 1.5, 1.5);
  }
})();
function drawPaper(camY){
  const pp = PAPER();
  applyPaper();
  ctx.fillStyle = pp.bg;
  ctx.fillRect(0,0,W,H);
  const gap = 34;
  const off = ((-camY*0.35) % gap + gap) % gap;
  ctx.strokeStyle = pp.line; ctx.lineWidth = 1;
  if(pp.mode === 'ruled' || pp.mode === 'grid'){
    ctx.beginPath();
    for(let y=off; y<H; y+=gap){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }
  if(pp.mode === 'grid'){
    ctx.beginPath();
    for(let x=8; x<W; x+=gap){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    ctx.stroke();
  }
  if(pp.mode === 'blank'){
    // parchment: rough blotches instead of lines
    ctx.globalAlpha = 0.05; ctx.fillStyle = '#7a5c30';
    for(let i=0;i<6;i++) { ctx.beginPath(); ctx.arc(60+rnd(3,i)*360, (rnd(4,i)*900 - camY*0.1)%H, 50+rnd(5,i)*60, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  if(pp.margin){
    ctx.strokeStyle = pp.margin; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(42,0); ctx.lineTo(42,H); ctx.stroke();
  }
  if(savePaperKey() !== 'chalk') ctx.drawImage(grain,0,0);
}

/* ---------------- sound (WebAudio, no files) --------------- */
let AC = null, muted = false;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function beep(freq, dur, type, vol, slide){
  if(muted) return; const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, ac.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), ac.currentTime+dur);
  g.gain.setValueAtTime(vol||0.15, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur+0.02);
}

  fall(){ beep(500,0.5,'sine',0.15,-380); },

/* ---------------- play-data push (for Papa) -----------------
   On first launch the game asks who is playing (or reads ?player=Name
   from the link). The name tags every save AND the play reports pushed
   to Papa's private ntfy topic: level clears + session summaries. */
const NAME_KEY = 'bhPlayerName';
let PLAYER_TAG = '';
try{
  const qp = new URLSearchParams(location.search).get('player');
  if(qp) localStorage.setItem(NAME_KEY, qp.trim().slice(0,16));
  PLAYER_TAG = localStorage.getItem(NAME_KEY) || '';
}catch(e){}
function registerPlayer(nm){
  let stored = false;
  try{ localStorage.setItem(NAME_KEY, nm); stored = true; }catch(e){}
  if(stored) location.reload();
  else { PLAYER_TAG = nm; state = 'title'; }   // private mode: play anyway, no reload loop
}
const TELEMETRY_URL = ['https://ntfy.sh/', 'manote', 'book-papa-', '7kq2xv9r3m'].join('');
const TQ_KEY = 'bubbleHopTQ' + (PLAYER_TAG ? '.' + PLAYER_TAG : '');
let sessStart = Date.now();
let sessLevels = {};              // this session: {level:{tries,wins,best}}
let lastSummaryAt = 0;
function sessLevel(n){ return sessLevels[n] = sessLevels[n] || {tries:0, wins:0, best:null}; }
function tqueue(){ try{ return JSON.parse(localStorage.getItem(TQ_KEY)) || []; }catch(e){ return []; } }
function tqSave(q){ try{ localStorage.setItem(TQ_KEY, JSON.stringify(q.slice(-40))); }catch(e){} }
function tSend(title, body){
  if(!PLAYER_TAG || !TELEMETRY_URL) return;
  const q = tqueue(); q.push({t:title, b:body}); tqSave(q);
  tFlush();
}
function tFlush(){
  if(!PLAYER_TAG || !TELEMETRY_URL) return;
  const q = tqueue();
  if(!q.length) return;
  const item = q[0];
  fetch(TELEMETRY_URL + '?title=' + encodeURIComponent(item.t) + '&tags=video_game',
        {method:'POST', body:item.b, mode:'no-cors'})
    .then(()=>{ const q2 = tqueue(); q2.shift(); tqSave(q2); if(q2.length) setTimeout(tFlush, 900); })
    .catch(()=>{});                      // offline: stays queued for next time
}
function tSessionSummary(){
  if(!PLAYER_TAG || !TELEMETRY_URL) return;
  if(Date.now() - lastSummaryAt < 60000) return;    // don't spam on quick tab flips
  const mins = Math.round((Date.now() - sessStart)/6000)/10;
  const parts = Object.keys(sessLevels).map(n=>{
    const L = sessLevels[n];
    return 'Level ' + n + ': ' + L.tries + (L.tries===1?' try':' tries') +
           (L.wins ? ' — CLEARED' + (L.best ? ' in ' + fmtTime(L.best) : '') : '');
  });
  if(mins < 0.5 && !parts.length) return;
  lastSummaryAt = Date.now();
  const body = mins + ' min this session.\n' + (parts.join('\n') || '(menus only)') +
    '\nAll-time: ' + Math.round((save.stats.playSec||0)/60) + ' min • ' + save.coins +
    ' coins • reached Lv' + save.levelReached;
  const url = TELEMETRY_URL + '?title=' + encodeURIComponent('📊 ' + PLAYER_TAG + ' — play session') + '&tags=bar_chart';
  let sent = false;
  if(navigator.sendBeacon){ try{ sent = navigator.sendBeacon(url, body); }catch(e){} }
  if(!sent) tSend('📊 ' + PLAYER_TAG + ' — play session', body);
  sessStart = Date.now(); sessLevels = {};
}
window.addEventListener('pagehide', ()=>{ try{ persist(); }catch(e){} tSessionSummary(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') tSessionSummary(); });
window.addEventListener('online', tFlush);
setTimeout(tFlush, 4000);               // flush anything left over from an offline session

const SAVE_DEFAULTS = {
  coins: 0, keysHeld: 0, rainbowDrops: 0,
  questSet: 0, questProgress: [0,0,0], set4Done: false,
  selected: 'muntaha',
  unlocked: {muntaha:true, anya:true},

  bestTime: {},       // fastest completion per level, in seconds

let save = JSON.parse(JSON.stringify(SAVE_DEFAULTS));
try{
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if(s && typeof s === 'object'){
    save = Object.assign(save, s);
    // deep-merge nested defaults so old saves upgrade cleanly
    for(const k of ['unlocked','pieces','taken','chestsOpened','bookmark','levelsDone','bestTime','stats'])
      save[k] = Object.assign(JSON.parse(JSON.stringify(SAVE_DEFAULTS[k])), s[k]||{});
    if(!Array.isArray(save.papers) || !save.papers.length) save.papers = ['ruled'];
  }
}catch(e){}
muted = !!save.muted;
let muteBounce = !!save.muteBounce;
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---------------- quests (top-of-page icons) ---------------- */
/* Sets 1–5 use one-time collectibles; sets 6+ cycle repeatable ACTION quests
   (bounce, climb, ride movers, stamp bookmarks, no-fall runs) forever. */
const QUEST_SETS = [
  [{t:'coin',n:7},{t:'key',n:2},{t:'magnet',n:2}],
  [{t:'coin',n:12},{t:'colorbox',n:2},{t:'key',n:3}],
  [{t:'coin',n:18},{t:'magnet',n:4},{t:'star',n:3}],
  [{t:'coin',n:25},{t:'colorbox',n:4},{t:'key',n:5}],
  [{t:'coin',n:35},{t:'star',n:6},{t:'magnet',n:6}]
];
const ACTION_SETS = [
  [{t:'bubbles',n:40},{t:'climb',n:800},{t:'movers',n:10}],
  [{t:'bookmarks',n:5},{t:'bubbles',n:60},{t:'noFall',n:1}],
  [{t:'climb',n:1500},{t:'movers',n:20},{t:'bubbles',n:80}]
];
function activeQuests(){
  if(save.questSet < QUEST_SETS.length) return QUEST_SETS[save.questSet];
  return ACTION_SETS[(save.questSet - QUEST_SETS.length) % ACTION_SETS.length];
}
let questFlash = [0,0,0];      // sparkle timer when a quest ticks
let setBanner = 0;             // "quests complete!" banner timer
let setBannerText = '';

function questCollect(type, amt){
  amt = amt || 1;
  const qs = activeQuests();
  let changed = false;
  for(let i=0;i<qs.length;i++){
    if(qs[i].t===type && save.questProgress[i] < qs[i].n){
      save.questProgress[i] = Math.min(qs[i].n, save.questProgress[i] + amt);
      questFlash[i] = 0.8;
      changed = true;
      if(save.questProgress[i] === qs[i].n) SFX.quest();
      break;
    }
  }
  if(qs.every((q,i)=>save.questProgress[i]>=q.n)) completeQuestSet();
  else if(changed) persist();
}

function completeQuestSet(){
  const idx = save.questSet;
  save.questSet++;
  save.questProgress = [0,0,0];
  setBanner = 3.5;
  SFX.win();
  if(idx === 0){                       // board 1 → ZOYA!
    setBannerText = 'Quest board done!';
    unlockChar('zoya');
  } else if(idx === 1){                // board 2 → free piece + coins
    save.coins += 20;
    grantPiece();
    setBannerText = 'Board done! +20 coins & a piece!';
  } else if(idx === 2){                // board 3 → a rainbow drop
    save.rainbowDrops++;
    setBannerText = 'Board done! A RAINBOW DROP!';
  } else if(idx === 3){                // board 4 → half of Luna's secret
    save.set4Done = true;
    setBannerText = 'Board 4 done! Luna is close...';
    checkLunaUnlock();
  } else if(idx === 4){                // board 5 → coins + a paper style
    save.coins += 40;
    const paper = grantPaper();
    setBannerText = paper ? 'Board done! +40 coins & ' + paper + '!' : 'Board done! +40 coins!';
  } else {                             // action boards: steady drip
    save.coins += 25;
    setBannerText = 'Quest board done! +25 coins!';
  }
  persist();
}

function unlockChar(id){
  if(save.unlocked[id]) return;
  save.unlocked[id] = true;
  if(id === 'luna') save.secretsRevealed = true;   // "?" cards appear after Luna
  persist();
  celebration = {char:id};
  stateReturn = ['play','win','select','shop','map'].includes(state) ? state : 'title';

function grantPiece(forChar){
  const ch = forChar || (save.pieces.aisha < 3 && !save.unlocked.aisha ? 'aisha'
                       : save.pieces.lily < 3 && !save.unlocked.lily ? 'lily' : null);
  if(!ch){ save.coins += 12; return null; }
  save.pieces[ch]++;
  persist();
  if(save.pieces[ch] >= 3) unlockChar(ch);
  return ch;
}
function grantPaper(){
  const missing = Object.keys(PAPERS).filter(k=>!save.papers.includes(k));
  if(!missing.length) return null;
  const k = missing[Math.floor(Math.random()*missing.length)];
  save.papers.push(k);
  persist();
  return PAPERS[k].name;
}
function checkLunaUnlock(){
  if(save.set4Done && save.levelReached >= 14) unlockChar('luna');
}

/* ============================================================
   LEVELS — world y goes NEGATIVE upward; x = center.
   Level 1 is hand-authored (Anya approved it); 2–20 come from
   LEVEL_DEFS + a seeded generator with reachability limits.
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---- generator for levels 2–20 ---- */
function buildLevelRaw(n){
  if(n === 1) return buildLevel1Raw();
  const def = LEVEL_DEFS[n];
  const rng = mulberry32(n*7919 + 13);
  const R = (a,b)=> a + rng()*(b-a);
  const P = [], items = [];
  const H2 = def.h;

  function pick(weights){
    let total = 0; for(const k in weights) total += weights[k];
    let v = rng()*total;
    for(const k in weights){ v -= weights[k]; if(v<=0) return k; }
    return 'plat';
  }
  function typesAt(y){
    if(!def.sections) return def.types;
    const f = -y / H2;
    for(const s of def.sections) if(f < s.until) return s.types;
    return def.types;
  }

  // --- main chain, bottom to top ---
  let y = 0, x = 240, prevKind = 'plat';
  const chain = [];
  P.push({type:'plat', x:240, y:0, w:220, h:26, move:null, seed:3});
  while(y > -H2 + 260){
    let gap = R(def.gap[0], def.gap[1]);
    if(prevKind === 'yellow') gap = R(240, 320);        // trampoline launch
    if(prevKind === 'green')  gap = R(280, 400);        // balloon elevator
    y -= gap;
    x = Math.max(70, Math.min(410, x + R(-160, 160)));
    const kind = pick(typesAt(y));
    const seed = P.length*13 + n*7 + 3;
    let node;
    if(kind === 'plat' || kind === 'crumble' || kind === 'smudge'){
      const w = R(95, 130);
      const mover = kind === 'plat' && rng() < def.mover.chance;
      node = {type:'plat', x, y, w, h:26, seed,
              move: mover ? {range:R(80,150), speed:R(def.mover.speed[0], def.mover.speed[1])} : null};
      if(mover && def.mover.pattern && rng() < 0.4)
        node.pattern = {ry: R(30,55), kind: rng()<0.5 ? 'circle' : 'fig8'};
      if(kind === 'crumble') node.crumble = {hits:0, limit:2, fallT:0};
      if(kind === 'smudge'){ node.smudge = {period: R(2.2,3.2), phase: rng()*6}; node.move = null; node.pattern = null; }
    } else {
      node = {type:'bubble', x, y, r:30, kind: kind==='bubble' ? 'norm' : kind,
              timer:-1, popped:false, dy:0, seed};
      if(kind === 'red'){ node.range = R(90,140); node.speed = R(.7,1.1); }
    }
    node.chainIdx = chain.length;
    chain.push(node); P.push(node);
    prevKind = kind === 'plat' || kind === 'crumble' || kind === 'smudge' ? 'plat' : kind;
  }

  // --- reachability fill: no vertical gap taller than a bounce can cross ---
  function fillBetween(a, bY, bX){
    let allowed = a.kind === 'yellow' ? 520 : a.kind === 'green' ? 680 : 185;
    let fromY = a.y, fromX = a.x;
    while(fromY - bY > allowed){
      const ny = fromY - Math.min(allowed - 25, 160);
      const nx = Math.max(70, Math.min(410, (fromX + bX)/2 + R(-60,60)));
      P.push({type:'bubble', x:nx, y:ny, r:30, kind:'norm', timer:-1, popped:false, dy:0,
              seed:P.length*13+n*7+3, fill:true});
      fromY = ny; fromX = nx; allowed = 250;      // bubbles bounce higher
    }
  }
  for(let i=0;i<chain.length-1;i++) fillBetween(chain[i], chain[i+1].y, chain[i+1].x);
  fillBetween(chain[chain.length-1], -H2, 240);   // ...and the last stretch to the flag

  // --- bookmarks at even spacing (replace nearest SAFE chain node:
  //     never a boost bubble, never below a gap only a boost can cross) ---
  for(let b=1; b<=def.bookmarks; b++){
    const targetY = -H2 * b / (def.bookmarks+1);
    let best = null, bd = 1e9;
    for(const node of chain){
      if(node.type === 'bookmark') continue;
      if(node.kind === 'yellow' || node.kind === 'green') continue;
      const nxt = chain[node.chainIdx+1];
      if(nxt && node.y - nxt.y > 180) continue;
      const d = Math.abs(node.y - targetY); if(d < bd){ bd = d; best = node; }
    }
    if(best){
      best.type = 'bookmark'; best.w = 190; best.h = 26; best.stamped = false;
      best.x = Math.max(120, Math.min(360, best.x));
      best.move = null; best.pattern = null; best.crumble = null; best.smudge = null;
      delete best.r; delete best.kind; delete best.timer;
    }
  }

  // --- risky twin route (safe chain stays; twin gets the loot) ---
  const riskyNodes = [];
  if(def.routes){
    for(const node of chain){
      const f = -node.y / H2;
      if(f > def.routes.f1 && f < def.routes.f2 && node.type !== 'bookmark'){
        const side = node.x < 240 ? 1 : -1;
        const rx = Math.max(60, Math.min(420, node.x + side*R(150,190)));
        const twin = rng() < 0.55
          ? {type:'bubble', x:rx, y:node.y - R(-20,20), r:30, kind:'norm', timer:-1, popped:false, dy:0, seed:P.length*13+n*7+3}
          : {type:'plat', x:rx, y:node.y - R(-20,20), w:R(85,105), h:26, move:null, seed:P.length*13+n*7+3,
             crumble:{hits:0, limit:2, fallT:0}};
        twin.risky = true;
        P.push(twin); riskyNodes.push(twin);
      }
    }
  }

  // --- secret route (L16): a yellow bubble at the page edge → hidden chain → rainbow chest ---
  if(def.secret){
    const baseY = -H2 * 0.62;
    P.push({type:'bubble', x:52, y:baseY, r:26, kind:'yellow', timer:-1, popped:false, dy:0, seed:801, secret:true});
    P.push({type:'bubble', x:70, y:baseY-300, r:26, kind:'norm', timer:-1, popped:false, dy:0, seed:802, secret:true});
    P.push({type:'plat', x:100, y:baseY-560, w:120, h:26, move:null, seed:803, secret:true});
    items.push({t:'chest', kind:'rainbow', reward:'doodle', x:100, y:baseY-620, taken:false, seed:804, phase:0});
  }

  // --- items along the chain ---
  function nodeAt(f){
    const targetY = -H2 * f;
    let best = chain[0], bd = 1e9;
    for(const node of chain){ const d = Math.abs(node.y - targetY); if(d < bd){ bd = d; best = node; } }
    return best;
  }
  function itemOn(node, t, extra){
    const nx = node.x + R(-20,20);
    items.push(Object.assign({t, x:Math.max(40,Math.min(440,nx)), y:node.y - R(48,70),
      taken:false, seed:items.length*7+n*3+2, phase:(items.length*1.37)%6}, extra||{}));
  }
  // coins: arcs over evenly spaced chain nodes
  let placed = 0, ci = 1;
  const per = Math.max(1, Math.floor(chain.length / Math.max(1, Math.ceil(def.coins/2.4))));
  while(placed < def.coins && ci < chain.length){
    const node = chain[ci];
    const burstN = Math.min(def.coins - placed, 1 + Math.floor(rng()*3));
    for(let k=0;k<burstN;k++)
      items.push({t:'coin', x:Math.max(35,Math.min(445, node.x - (burstN-1)*24/2 + k*24 + R(-6,6))),
                  y:node.y - 52 - Math.abs(k-(burstN-1)/2)*10,
                  taken:false, seed:items.length*7+n*3+2, phase:(items.length*1.37)%6});
    placed += burstN;
    ci += per;
  }
  const counts = defaultCounts(n, def);
  const keyFs = [.3,.62,.88], magFs = [.4,.72,.55], boxFs = [.5,.82];
  for(let i=0;i<counts.keys;i++)   itemOn(nodeAt(keyFs[i%3] + R(-.04,.04)), 'key');
  for(let i=0;i<counts.magnets;i++)itemOn(nodeAt(magFs[i%3] + R(-.04,.04)), 'magnet');
  for(let i=0;i<counts.boxes;i++)  itemOn(nodeAt(boxFs[i%2] + R(-.04,.04)), 'colorbox');
  // stars & pieces live on the risky route when there is one
  const starHosts = riskyNodes.length ? riskyNodes : chain;
  for(let i=0;i<(def.stars||0);i++)
    itemOn(starHosts[Math.floor(rng()*starHosts.length)], 'star');
  for(const pd of (def.pieces||[])){
    const host = riskyNodes.length ? riskyNodes[Math.floor(riskyNodes.length*0.5)] : nodeAt(pd.f);
    itemOn(host, 'piece', {char: pd.char});
  }
  for(const f of (def.drops||[])) itemOn(nodeAt(f), 'drop');
  for(const cd of (def.chests||[])){
    const host = nodeAt(cd.f);
    items.push({t:'chest', kind:cd.kind, char:cd.char||null, reward:cd.kind==='rainbow' ? 'jackpot' : null,
      x:Math.max(60,Math.min(420, host.x + R(-30,30))), y:host.y - 66,
      taken:false, seed:items.length*7+n*3+2, phase:0});
  }

  // --- hazards ---
  const wind = (def.wind||[]).map(wd=>({y1:-H2*wd.f2, y2:-H2*wd.f1, dir:wd.dir}));
  const birds = [];
  for(let i=0;i<(def.birds||0);i++)
    birds.push({y:-H2*(0.25 + 0.6*rng()), speed:R(90,150), dir:rng()<0.5?-1:1, phase:rng()*6, hitT:0});
  const spinners = [];
  for(let i=0;i<(def.spinners||0);i++){
    const host = nodeAt(0.3 + 0.55*rng());
    spinners.push({x:Math.max(70,Math.min(410,host.x + R(-40,40))), y:host.y - 110, len:52, speed:R(1.6,2.4)*(rng()<0.5?-1:1), phase:rng()*6});
  }
  // tape strips on some platforms
  if(def.tape){
    const platNodes = chain.filter(c=>c.type==='plat' && !c.crumble && !c.smudge);
    for(let i=0;i<def.tape && platNodes.length;i++)
      platNodes[Math.floor(rng()*platNodes.length)].tape = true;
  }
  const eraser = def.eraser ? {speed:def.eraser.speed, y:300, active:false, fromF:def.eraser.fromF||0.12} : null;

  P.push({type:'finish', x:240, y:-H2, w:270, h:30, seed:999});
  return {plats:P, items, top:-H2, def, wind, birds, spinners, eraser};
}

/* ---- wrap: apply the one-time ledger (ghosts) + saved state ---- */
function buildLevel(n){
  const lv = buildLevelRaw(n);
  lv.n = n;
  lv.items.forEach((it, i) => { it.id = i; });
  const taken = save.taken[n] || [];
  for(const it of lv.items){
    if(taken.includes(it.id)){ it.taken = true; it.ghost = true; }
  }
  // finish chest one-time
  lv.chestOpenedBefore = !!save.chestsOpened[n];
  // restore stamped bookmark
  const bms = lv.plats.filter(p=>p.type==='bookmark');
  bms.forEach((b, i) => { b.bmIndex = i; });
  lv.bookmarks = bms;
  const stamped = save.bookmark[n];
  if(stamped !== undefined && bms[stamped]) bms[stamped].stamped = true;
  return lv;
}

/* ---------------- player (with verlet limbs) --------------- */
function makeLimb(len1, len2){
  return {e:{x:0,y:0,px:0,py:0}, h:{x:0,y:0,px:0,py:0}, len1, len2, init:false};
}
const player = {
  x:240, y:-40, vx:0, vy:0, r:15,
  squash:1, grinT:0, blinkT:2, faceDir:1,
  magnetT:0, stickyT:0, alive:true,
  limbs:{ armL:makeLimb(13,12), armR:makeLimb(13,12), legL:makeLimb(13,12), legR:makeLimb(13,12) }
};
function resetPlayer(){
  player.x = 240; player.y = -40; player.vx = 0; player.vy = -200;
  player.squash = 1; player.magnetT = 0; player.stickyT = 0; player.alive = true; player.grinT = 0;
  for(const k in player.limbs) player.limbs[k].init = false;
}
function limbUpdate(l, ax, ay, dt){
  if(!l.init){ l.e.x=ax; l.e.y=ay+l.len1; l.e.px=l.e.x; l.e.py=l.e.y;
               l.h.x=ax; l.h.y=ay+l.len1+l.len2; l.h.px=l.h.x; l.h.py=l.h.y; l.init=true; }
  for(const p of [l.e, l.h]){
    const nx = p.x + (p.x-p.px)*0.86, ny = p.y + (p.y-p.py)*0.86 + 260*dt*dt*60;
    p.px = p.x; p.py = p.y; p.x = nx; p.y = ny;
  }
  for(let i=0;i<3;i++){
    // anchor→elbow
    let dx=l.e.x-ax, dy=l.e.y-ay, d=Math.hypot(dx,dy)||1, diff=(d-l.len1)/d;
    l.e.x -= dx*diff; l.e.y -= dy*diff;
    // elbow→hand
    dx=l.h.x-l.e.x; dy=l.h.y-l.e.y; d=Math.hypot(dx,dy)||1; diff=(d-l.len2)/d*0.5;
    l.h.x -= dx*diff; l.h.y -= dy*diff;
    l.e.x += dx*diff; l.e.y += dy*diff;
  }
}

/* ---------------- physics constants ------------------------ */
const GRAV = 1900;
const BOUNCE_V = 900;        // platform bounce
const BUBBLE_V = 1010;       // bubbles are extra bouncy
const STEER = 1500;
const MAXVX = 420;

/* ---------------- game state ------------------------------- */
let state = PLAYER_TAG ? 'title' : 'who';   // who | title | map | select | shop | play | win | dead | fell | chest | friend
let level = null;
let curLevel = 1;
let camY = 0;                // world y at top of screen
let roundCoins = 0, roundKeys = 0, roundFalls = 0;
let particles = [], floaties = [];
let wash = null;             // color-wash animation
let chestResult = null;      // finish chest outcome (win screen)
let chestReveal = null;      // wandering-chest reveal screen data
let heightClimbed = 0, lastClimbMark = 0;
let time = 0;
let roundTime = 0;           // stopwatch for this try (bookmark respawns keep it running)
let winTimeInfo = null;      // {t, isNew} for the win screen
let shake = 0;
let chestDeniedT = 0;        // cooldown for "need a key!" floaties

function fmtTime(s){
  const m = Math.floor(s/60), sec = s - m*60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

function startRound(n){
  curLevel = n || curLevel || 1;
  level = buildLevel(curLevel);
  const st = save.stats.levels[curLevel] = save.stats.levels[curLevel] || {tries:0, wins:0};
  st.tries++;
  sessLevel(curLevel).tries++;
  resetPlayer();
  roundCoins = 0; roundKeys = 0; roundFalls = 0;
  particles = []; floaties = [];
  wash = null; chestResult = null; chestReveal = null;
  heightClimbed = 0; lastClimbMark = 0;
  roundTime = 0; winTimeInfo = null;
  const bmIdx = save.bookmark[curLevel];
  if(bmIdx !== undefined && level.bookmarks[bmIdx]){
    const bm = level.bookmarks[bmIdx];
    player.x = bm.x; player.y = bm.y - 40; player.vy = -200;
    camY = bm.y - H + 220;
    heightClimbed = lastClimbMark = Math.max(0, -Math.round(bm.y/10));
  } else {
    camY = -H + 60;
  }
  if(level.eraser){ level.eraser.active = false; level.eraser.y = player.y + 800; }
  state = 'play';
}

function respawnAtBookmark(){
  const bmIdx = save.bookmark[curLevel];
  const bm = bmIdx !== undefined ? (level.bookmarks[bmIdx] || null) : null;
  if(!bm){ startRound(curLevel); return; }
  player.x = bm.x; player.y = bm.y - 40; player.vx = 0; player.vy = -200;
  player.alive = true; player.magnetT = 0;
  for(const k in player.limbs) player.limbs[k].init = false;
  camY = bm.y - H + 220;
  if(level.eraser) level.eraser.y = bm.y + 800;
  // the page redraws itself: popped bubbles and crumbled platforms come back
  for(const p of level.plats){
    if(p.type === 'bubble'){ p.popped = false; p.timer = -1; p.rising = false; p.dy = 0; p.respawnT = 0; p.wobbleT = 0; }
    if(p.crumble){ p.crumble.hits = 0; p.crumble.fallT = 0; }
  }
  state = 'play';
}

function handleFall(){
  roundFalls++;
  SFX.fall();
  save.bestHeight = Math.max(save.bestHeight, heightClimbed);
  persist();
  state = (save.bookmark[curLevel] !== undefined) ? 'fell' : 'dead';
}

function recordTaken(it){
  it.taken = true;
  if(!save.taken[curLevel]) save.taken[curLevel] = [];
  save.taken[curLevel].push(it.id);
}

/* wandering / rainbow chest opening */
function tryOpenChest(it){
  if(time - chestDeniedT < 1.2 && chestDeniedT > 0) return;
  const needsDrop = it.kind === 'rainbow';
  if(needsDrop ? save.rainbowDrops < 1 : (save.keysHeld < 1 && save.rainbowDrops < 1)){
    chestDeniedT = time;
    floatText(needsDrop ? 'Needs a RAINBOW DROP!' : 'Need a key!', it.x, it.y - 40, '#d66969');
    return;
  }
  if(needsDrop) save.rainbowDrops--;
  else if(save.keysHeld > 0) save.keysHeld--;
  else save.rainbowDrops--;                        // rainbow drop opens any chest
  recordTaken(it);
  const ch = CHARACTERS[save.selected] || CHARACTERS.muntaha;
  const dbl = ch.chestDouble ? 2 : 1;
  let lines = [];
  if(it.kind === 'rainbow' && it.reward === 'doodle' && !save.unlocked.doodle){
    persist();
    SFX.chest();
    unlockChar('doodle');                          // celebration replaces the reveal
    return;
  }
  if(it.kind === 'rainbow'){                       // jackpot chest
    const got = 60 * dbl;
    save.coins += got; roundCoins += got;
    save.rainbowDrops++;
    const paper = grantPaper();
    lines = ['JACKPOT!', '+' + got + ' coins!', '+1 rainbow drop!'];
    if(paper) lines.push(paper + ' unlocked!');
  } else if(it.kind === 'piece'){
    const who = grantPiece(it.char);
    lines = who ? ['A puzzle piece!', CHARACTERS[who].name + ': ' + save.pieces[who] + '/3']
                : ['A piece... already done!', '+12 coins instead!'];
  } else {                                         // surprise chest
    const roll = Math.random();
    if(roll < 0.5){ const got = (10 + Math.floor(Math.random()*9)) * dbl; save.coins += got; roundCoins += got; lines = ['Coins!', '+' + got + ' coins!']; }
    else if(roll < 0.8){ save.coins += 5; roundCoins += 5; questCollect('star'); lines = ['A star!', '+5 coins!']; }
    else if(roll < 0.9){ save.rainbowDrops++; lines = ['Wow... a RAINBOW DROP!']; }
    else { const paper = grantPaper(); lines = paper ? ['A new place!', paper + ' unlocked!'] : ['+15 coins!']; if(!paper){ save.coins += 15; roundCoins += 15; } }
  }
  persist();
  SFX.chest();
  // a piece inside may have just unlocked a friend — never clobber that celebration
  if(state === 'play'){
    chestReveal = {lines, t:0};
    stateReturn = 'play';
    state = 'chest';
  }
}

/* ---------------- input ------------------------------------ */
const keys = {};
let touchDir = 0, isTouch = false;
window.addEventListener('keydown', e=>{
  keys[e.key] = true;
  if(e.key===' ' || e.key==='ArrowUp') e.preventDefault();
  if(state === 'who'){                          // a real keyboard works too
    if(/^[a-zA-Z ]$/.test(e.key)) whoType(e.key);
    else if(e.key === 'Backspace') whoName = whoName.slice(0,-1);
    else if(e.key === 'Enter' && whoName.trim()) registerPlayer(fmtName(whoName));
  }
});
window.addEventListener('keyup', e=>{ keys[e.key] = false; });

let uiButtons = [];
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
window.addEventListener('pointerdown', e=>{
  audio();
  if(e.pointerType==='touch') isTouch = true;
  const p = toCanvas(e);
  for(const b of uiButtons){
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){ SFX.click(); b.cb(); return; }
  }
  if(state==='play'){ touchDir = p.x < W/2 ? -1 : 1; }
});
window.addEventListener('pointerup',   ()=>{ touchDir = 0; });
window.addEventListener('pointercancel',()=>{ touchDir = 0; });

/* ---------------- update ----------------------------------- */
function platXAt(p, t){
  if(!p.move) return p.x;
  return p.x + Math.sin(t * p.move.speed + p.seed) * p.move.range;
}
function platYAt(p, t){
  if(!p.pattern || !p.move) return p.y;
  const th = t * p.move.speed + p.seed;
  return p.y + Math.cos(th) * p.pattern.ry * (p.pattern.kind === 'fig8' ? Math.sin(th) * 1.3 : 1);
}
function platVXAt(p, t){
  if(!p.move) return 0;
  return Math.cos(t * p.move.speed + p.seed) * p.move.speed * p.move.range;
}
function bubXAt(b, t){
  if(b.kind !== 'red') return b.x;
  return b.x + Math.sin(t * b.speed + b.seed) * b.range;
}
function bubYAt(b){ return b.y + (b.dy || 0); }
function smudgeSolid(p, t){
  return Math.sin(t * Math.PI*2 / p.smudge.period + p.smudge.phase) > -0.2;
}
function birdX(b, t){
  const span = W + 160;
  return ((b.phase*97 + t*b.speed*b.dir) % span + span) % span - 80;
}
function bubbleLife(){
  const base = (level && level.def && level.def.timer) || 10;
  const ch = CHARACTERS[save.selected] || CHARACTERS.muntaha;
  return base + (ch.bubbleBonus || 0);
}

function update(dt){
  time += dt;
  wob = Math.floor(time * 6);
  if(setBanner>0) setBanner -= dt;
  for(let i=0;i<3;i++) if(questFlash[i]>0) questFlash[i]-=dt;

  if(state !== 'play'){
    // gentle idle wobble on menus
    return;
  }

  roundTime += dt;                                 // the try stopwatch
  save.stats.playSec += dt;                        // lifetime play clock
  const ch = CHARACTERS[save.selected] || CHARACTERS.muntaha;

  // steering
  let dir = 0;
  if(keys['ArrowLeft']||keys['a']||keys['A']) dir -= 1;
  if(keys['ArrowRight']||keys['d']||keys['D']) dir += 1;
  if(touchDir) dir = touchDir;
  if(dir) player.faceDir = dir;
  const sticky = player.stickyT > 0 ? 0.35 : 1;    // tape glue wears off quickly
  if(player.stickyT > 0) player.stickyT -= dt;
  player.vx += dir * STEER * (ch.steer||1) * sticky * dt;
  if(!dir) player.vx *= Math.pow(0.002, dt);       // friction
  player.vx = Math.max(-MAXVX, Math.min(MAXVX, player.vx));

  // wind swirls push (Luna barely feels them)
  for(const wband of level.wind){
    if(player.y > wband.y1 && player.y < wband.y2){
      player.vx += wband.dir * 230 * (ch.windResist||1) * dt;
      if(Math.random() < dt*6)
        particles.push({x:wband.dir>0?-4:W+4, y:player.y + (Math.random()-0.5)*300,
                        vx:wband.dir*180, vy:0, life:1.2, color:PAL().bubble, wind:true});
    }
  }

  const prevY = player.y;
  player.vy += GRAV * (ch.floaty||1) * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // wrap around screen edges (Doodle-Jump style)
  if(player.x < -14) player.x = W+14;
  if(player.x > W+14) player.x = -14;

  // squash recovery
  player.squash += (1 - player.squash) * Math.min(1, dt*10);
  if(player.grinT>0) player.grinT -= dt;
  player.blinkT -= dt;
  if(player.blinkT < -0.12) player.blinkT = 1.5 + Math.random()*2.5;

  const feet = player.y + player.r;
  const prevFeet = prevY + player.r;

  // ---- collisions (only while falling) ----
  if(player.vy > 0){
    for(const p of level.plats){
      if(p.type === 'bubble'){
        if(p.popped) continue;
        const bx = bubXAt(p, time), by = bubYAt(p);
        const dx = player.x - bx, dy = (player.y + player.r*0.6) - by;
        if(dx*dx + dy*dy < (p.r + player.r*0.7)*(p.r + player.r*0.7) && player.y < by){
          let kick = BUBBLE_V;
          if(p.kind === 'yellow') kick *= 1.42;          // trampoline!
          if(p.kind === 'purple') kick *= 1.12;          // shy but springy
          player.vy = -kick * (ch.bounce||1);
          player.squash = 1.45;
          player.grinT = 0.5;
          p.wobbleT = 0.4;
          if(p.timer < 0) p.timer = p.kind === 'purple' ? 5 : bubbleLife();
          if(p.kind === 'green' && !p.rising) p.rising = true;   // balloon lifts off
          questCollect('bubbles');
          SFX.bubble();
          burst(bx, by - p.r, PAL().bubble, 5);
        }
      } else { // plat, bookmark or finish
        if(p.crumble && p.crumble.fallT > 0) continue;             // already collapsed
        if(p.smudge && !smudgeSolid(p, time)) continue;            // faded out right now
        const px = platXAt(p, time);
        const top = platYAt(p, time);
        if(prevFeet <= top + 6 && feet >= top &&
           Math.abs(player.x - px) < p.w/2 + player.r*0.7){
          player.y = top - player.r;
          // sticky tape: FULL bounce height (never a dead end!) but gluey feet —
          // steering goes sluggish for a moment after the schlorp
          player.vy = -BOUNCE_V * (ch.bounce||1);
          if(p.tape) player.stickyT = 0.9;
          player.vx += platVXAt(p, time) * 0.55;           // movers pass on momentum
          player.squash = p.tape ? 1.7 : 1.4;
          player.grinT = 0.4;
          if(p.move) questCollect('movers');
          if(p.tape){ if(!muteBounce) beep(120, 0.25, 'sawtooth', 0.1, -40); } else SFX.boing();
          burst(player.x, top, '#b9b2a0', 4);
          if(p.crumble){
            p.crumble.hits++;
            const limit = p.crumble.limit + (ch.crumbleBonus||0);
            if(p.crumble.hits >= limit){ p.crumble.fallT = 0.01; SFX.pop(); }
            else beep(200, 0.12, 'square', 0.08, -80);
          }
          if(p.type === 'bookmark' && !p.stamped){
            p.stamped = true;
            save.bookmark[curLevel] = p.bmIndex;
            persist();
            questCollect('bookmarks');
            SFX.key();
            floatText('BOOKMARKED!', px, top - 40, '#4f9e58');
          }
          if(p.type === 'finish'){ winRound(); return; }
        }
      }
    }
  }

  // ---- bubble timers / green rise / crumble fall ----
  for(const p of level.plats){
    if(p.crumble && p.crumble.fallT > 0){ p.crumble.fallT += dt; continue; }
    if(p.type!=='bubble') continue;
    if(p.popped){
      // green balloons drift back: they're elevators, not one-shot bubbles
      if(p.kind === 'green'){
        p.respawnT = (p.respawnT || 3) - dt;
        if(p.respawnT <= 0){ p.popped = false; p.rising = false; p.dy = 0; p.timer = -1; p.respawnT = 0; }
      }
      continue;
    }
    if(p.wobbleT>0) p.wobbleT -= dt;
    if(p.rising){
      p.dy -= 45*dt;
      if(p.dy < -500){
        p.popped = true; SFX.pop();
        burst(bubXAt(p,time), bubYAt(p), PAL().bubble, 12);
      }
    }
    if(p.timer > 0){
      p.timer -= dt;
      if(p.timer <= 0){
        p.popped = true;
        SFX.pop();
        const bx = bubXAt(p,time);
        burst(bx, bubYAt(p), PAL().bubble, 12);
        floatText('POP!', bx, bubYAt(p), '#d66969');
      }
    }
  }

  // ---- ink-blot birds (knockback, never deadly) ----
  for(const b of level.birds){
    if(b.hitT > 0){ b.hitT -= dt; continue; }
    const bx = birdX(b, time);
    if(Math.abs(player.x - bx) < 26 && Math.abs(player.y - b.y) < 22){
      b.hitT = 0.8;
      player.vx = b.dir * 430;
      player.vy = Math.min(player.vy, -220);
      beep(900, 0.12, 'square', 0.1, 300);
      burst(bx, b.y, INK, 6);
      floatText('SQUAWK!', bx, b.y - 20, INK);
    }
  }
  // ---- sharpener spinners (timed knockback) ----
  for(const s of level.spinners){
    if(s.hitT > 0){ s.hitT -= dt; continue; }
    const a = time*s.speed + s.phase;
    const tx = s.x + Math.cos(a)*s.len, ty = s.y + Math.sin(a)*s.len;
    if(Math.hypot(player.x - tx, player.y - ty) < 24 || Math.hypot(player.x - s.x, player.y - s.y) < 18){
      s.hitT = 0.8;
      player.vx = (player.x < tx ? -1 : 1) * 430;
      player.vy = Math.min(player.vy, -200);
      beep(300, 0.15, 'sawtooth', 0.1, -100);
    }
  }
  // ---- the eraser chase ----
  if(level.eraser){
    const er = level.eraser;
    if(!er.active && -player.y > level.def.h * er.fromF){ er.active = true; er.y = player.y + 700; }
    if(er.active){
      er.y -= er.speed * dt;                                  // it climbs after you!
      er.y = Math.min(er.y, player.y + 900);                  // never hopelessly far behind
      if(player.y + player.r > er.y - 16){ handleFall(); return; }
    }
  }

  // ---- collectibles ----
  const magnetOn = player.magnetT > 0;
  if(magnetOn) player.magnetT -= dt;
  for(const it of level.items){
    if(it.taken) continue;
    const pullable = it.t === 'coin' || it.t === 'star';
    const starPull = it.t === 'star' && ch.starPull;
    if((magnetOn && pullable) || starPull){
      const dx = player.x - it.x, dy = player.y - it.y, d = Math.hypot(dx,dy);
      const range = starPull ? 210 : 170;
      if(d < range && d > 1){ it.x += dx/d * 420*dt; it.y += dy/d * 420*dt; }
    }
    const dx = player.x - it.x, dy = player.y - it.y;
    if(dx*dx + dy*dy < 30*30){
      if(it.t === 'chest'){ tryOpenChest(it); if(state !== 'play') return; continue; }
      recordTaken(it);
      if(it.t==='coin'){ save.coins++; roundCoins++; SFX.coin(); questCollect('coin'); floatText('+1', it.x, it.y, '#c9931f'); }
      if(it.t==='star'){ save.coins += 5; roundCoins += 5; SFX.coin(); questCollect('star'); floatText('★ +5!', it.x, it.y, '#c9931f'); }
      if(it.t==='key'){ save.keysHeld++; roundKeys++; SFX.key(); questCollect('key'); floatText('KEY!', it.x, it.y, INK); }
      if(it.t==='magnet'){ player.magnetT = 8; SFX.magnet(); questCollect('magnet'); floatText('MAGNET!', it.x, it.y, '#4a86c9'); }
      if(it.t==='drop'){ save.rainbowDrops++; SFX.colorbox(); floatText('RAINBOW DROP!', it.x, it.y, '#8a6bc1'); }
      if(it.t==='piece'){
        const who = it.char;
        SFX.key();
        floatText('A PIECE OF ' + CHARACTERS[who].name.toUpperCase() + '!', it.x, it.y, CHARACTERS[who].tint);
        grantPiece(who);
        if(state !== 'play'){ persist(); return; }   // unlock celebration took over
      }
      if(it.t==='colorbox'){
        const others = Object.keys(PALETTES).filter(k=>k!==paletteKey);
        paletteKey = others[Math.floor(Math.random()*others.length)];
        wash = {t:0, x:it.x, y:it.y};
        SFX.colorbox(); questCollect('colorbox');
        floatText(PAL().name + '!', it.x, it.y, PAL().main);
      }
      burst(it.x, it.y, PAL().accent, 6);
      persist();
    }
  }

  // ---- limbs (they follow the motion) ----
  const sway = Math.max(-1, Math.min(1, player.vx/300));
  limbUpdate(player.limbs.armL, player.x-11 - sway*2, player.y-4, dt);
  limbUpdate(player.limbs.armR, player.x+11 - sway*2, player.y-4, dt);
  limbUpdate(player.limbs.legL, player.x-6, player.y+12, dt);
  limbUpdate(player.limbs.legR, player.x+6, player.y+12, dt);

  // ---- camera ----
  const target = player.y - H*0.42;
  if(target < camY) camY += (target - camY) * Math.min(1, dt*8);
  heightClimbed = Math.max(heightClimbed, -Math.round(player.y/10));
  if(heightClimbed > lastClimbMark){                 // climb action-quest ticks
    questCollect('climb', heightClimbed - lastClimbMark);
    lastClimbMark = heightClimbed;
  }

  // ---- fell off the page? ----
  if(player.y > camY + H + 70){ handleFall(); return; }

  // ---- particles / floaties / wash ----
  particles = particles.filter(p=>{
    if(!p.wind) p.vy += 700*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    return p.life > 0;
  });
  floaties = floaties.filter(f=>{ f.y -= 40*dt; f.life -= dt; return f.life > 0; });
  if(wash){ wash.t += dt*1.6; if(wash.t>1.6) wash = null; }
  if(shake>0) shake -= dt;
}

function winRound(){
  state = 'win';
  save.level1Done = save.level1Done || curLevel === 1;
  save.levelsDone[curLevel] = true;
  save.levelReached = Math.max(save.levelReached, Math.min(20, curLevel + 1));
  delete save.bookmark[curLevel];                    // finished: replay starts fresh
  save.bestHeight = Math.max(save.bestHeight, heightClimbed);
  const tRounded = Math.round(roundTime*10)/10;
  const isNewBest = !save.bestTime[curLevel] || tRounded < save.bestTime[curLevel];
  if(isNewBest) save.bestTime[curLevel] = tRounded;
  winTimeInfo = {t:tRounded, isNew:isNewBest};
  const st = save.stats.levels[curLevel] = save.stats.levels[curLevel] || {tries:0, wins:0};
  st.wins++; st.lastClear = tRounded;
  const sl = sessLevel(curLevel);
  sl.wins++;
  if(!sl.best || tRounded < sl.best) sl.best = tRounded;
  tSend('🏆 ' + PLAYER_TAG + ' beat Level ' + curLevel + '!',
        'Time ' + fmtTime(tRounded) + (isNewBest ? ' — NEW BEST!' : '') +
        ' • try #' + st.tries + ' • ' + save.coins + ' coins total');
  if(roundFalls === 0) questCollect('noFall');
  const ch = CHARACTERS[save.selected] || CHARACTERS.muntaha;
  // finish chest: one key, one time, coins under 20 (Anya's rule)
  if(level.chestOpenedBefore){
    chestResult = {ghost:true};
  } else if(save.keysHeld > 0){
    save.keysHeld--;
    const got = (8 + Math.floor(Math.random()*12)) * (ch.chestDouble ? 2 : 1);
    save.coins += got;
    roundCoins += got;
    save.chestsOpened[curLevel] = true;
    chestResult = {opened:true, coins:got};
    SFX.chest();
  } else {
    chestResult = {opened:false};
  }
  persist();
  SFX.win();
  checkLunaUnlock();
  if(curLevel === 20) unlockChar('inky');            // the top of the sky tower
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 60+Math.random()*160;
    particles.push({x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-80, life:0.5+Math.random()*0.4, color});
  }
}
function floatText(txt,x,y,color){ floaties.push({txt,x,y,color,life:1.1}); }

/* ============================================================
   DRAWING
   ============================================================ */
function sy(worldY){ return worldY - camY; }   // world→screen y

/* ---- collectible icons (hand-drawn) ---- */
function drawCoin(x,y,r,seed){
  pencil(0.9, 2);
  hatchCircle(x,y,r-2,'#e2b33c',0.5);
  sketchCircle(x,y,r,seed);
  sketchCircle(x,y,r*0.5,seed+3);
}
function drawKey(x,y,s,seed){
  pencil(0.9, 2);
  hatchCircle(x-s*0.5,y,s*0.42,'#c9931f',0.4);
  sketchCircle(x-s*0.5, y, s*0.45, seed);
  sketchLine(x-s*0.1, y, x+s*0.75, y, seed+1);
  sketchLine(x+s*0.45, y, x+s*0.45, y+s*0.35, seed+2);
  sketchLine(x+s*0.72, y, x+s*0.72, y+s*0.42, seed+3);
}
function drawMagnet(x,y,s,seed){
  pencil(0.95, 2.4, '#c14b4b');
  ctx.beginPath();
  ctx.arc(x, y - s*0.15, s*0.55, Math.PI, 0);
  ctx.stroke();
  sketchLine(x-s*0.55, y-s*0.15, x-s*0.55, y+s*0.5, seed, 1);
  sketchLine(x+s*0.55, y-s*0.15, x+s*0.55, y+s*0.5, seed+1, 1);
  pencil(0.9,2,INK);
  sketchLine(x-s*0.75, y+s*0.3, x-s*0.35, y+s*0.3, seed+2, 0.8);
  sketchLine(x+s*0.35, y+s*0.3, x+s*0.75, y+s*0.3, seed+3, 0.8);
}
function drawColorBox(x,y,s,seed){
  const cols = ['#e2699e','#4a86c9','#7fb85a','#e2b33c'];
  for(let i=0;i<4;i++){
    const qx = x + (i%2? 0 : -s/2), qy = y + (i<2? -s/2 : 0);
    hatchRect(qx, qy, s/2, s/2, cols[i], 0.55);
  }
  pencil(0.9, 2);
  sketchRect(x-s/2, y-s/2, s, s, seed);
  sketchLine(x, y-s/2, x, y+s/2, seed+4, 0.8);
  sketchLine(x-s/2, y, x+s/2, y, seed+5, 0.8);
}
function drawChest(x,y,s,seed,open){
  pencil(0.95, 2.2);
  hatchRect(x-s/2, y-s*0.35, s, s*0.55, '#b07c3e', 0.45);
  sketchRect(x-s/2, y-s*0.35, s, s*0.55, seed);
  if(open){
    sketchLine(x-s/2, y-s*0.35, x-s*0.6, y-s*0.85, seed+4);
    sketchLine(x-s*0.6, y-s*0.85, x+s*0.5, y-s*0.75, seed+5);
    sketchLine(x+s*0.5, y-s*0.75, x+s/2, y-s*0.35, seed+6);
  } else {
    hatchRect(x-s/2, y-s*0.55, s, s*0.2, '#b07c3e', 0.55);
    sketchRect(x-s/2, y-s*0.55, s, s*0.2, seed+4);
  }
  sketchCircle(x, y-s*0.18, s*0.09, seed+8);
}

/* ---- platforms ---- */
function drawPlat(p){
  const x = platXAt(p, time) - p.w/2;
  let y = sy(platYAt(p, time));
  if(p.crumble && p.crumble.fallT > 0){
    if(p.crumble.fallT > 1.2) return;                     // gone
    y += p.crumble.fallT * p.crumble.fallT * 700;         // tumbles off the page
  }
  if(y < -60 || y > H+60) return;
  let alpha = 1;
  if(p.smudge){
    const s = Math.sin(time * Math.PI*2 / p.smudge.period + p.smudge.phase);
    alpha = smudgeSolid(p, time) ? 0.55 + 0.45*Math.min(1, s+0.2) : 0.18;
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  hatchRect(x, y, p.w, p.h, PAL().main, 0.5*alpha);
  pencil(0.95*alpha, 2.2);
  sketchRect(x, y, p.w, p.h, p.seed);
  // wavy zigzag across (like the cake-slice drawing)
  ctx.beginPath();
  pencil(0.8*alpha, 1.8);
  const n = Math.ceil(p.w/12);
  for(let i=0;i<=n;i++){
    const px = x + (p.w*i/n);
    const py = y + p.h*0.45 + Math.sin(i*1.9 + p.seed)*4 + jit(p.seed+20,i,0.8);
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();
  // speed marks on movers (more marks = faster, like her hatch doodles)
  if(p.move){
    const marks = Math.round(p.move.speed*3.5);
    pencil(0.7*alpha, 1.6);
    for(let i=0;i<marks;i++){
      const mx = x + p.w/2 - marks*4 + i*8;
      sketchLine(mx, y-8, mx+3, y-16, p.seed+30+i, 0.7);
    }
  }
  // crumble cracks
  if(p.crumble && p.crumble.hits > 0){
    pencil(0.8, 1.6);
    sketchLine(x+p.w*0.3, y+2, x+p.w*0.45, y+p.h-3, p.seed+40, 2.4);
    sketchLine(x+p.w*0.45, y+p.h*0.5, x+p.w*0.62, y+3, p.seed+41, 2.4);
  }
  // sticky tape strip
  if(p.tape){
    ctx.globalAlpha = 0.45*alpha; ctx.fillStyle = '#e8d48a';
    ctx.fillRect(x+p.w*0.15, y-5, p.w*0.7, 9);
    ctx.globalAlpha = alpha;
    pencil(0.5, 1.4);
    sketchRect(x+p.w*0.15, y-5, p.w*0.7, 9, p.seed+50);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawBookmark(p){
  const x = p.x - p.w/2, y = sy(p.y);
  if(y < -80 || y > H+80) return;
  hatchRect(x, y, p.w, p.h, p.stamped ? '#4f9e58' : '#c9931f', 0.35);
  pencil(0.95, 2.2);
  sketchRect(x, y, p.w, p.h, p.seed);
  // ribbon bookmark hanging off the ledge
  const rx = x + p.w - 26;
  hatchRect(rx, y - 34, 18, 34, p.stamped ? '#4f9e58' : '#d66969', 0.6);
  pencil(0.9, 2);
  sketchLine(rx, y-34, rx, y, p.seed+1, 1);
  sketchLine(rx+18, y-34, rx+18, y, p.seed+2, 1);
  sketchLine(rx, y-34, rx+18, y-34, p.seed+3, 1);
  sketchLine(rx, y, rx+9, y-10, p.seed+4, 1);
  sketchLine(rx+9, y-10, rx+18, y, p.seed+5, 1);
  if(p.stamped){
    pencil(1, 2.6, '#4f9e58');
    sketchLine(x+16, y-12, x+22, y-4, p.seed+6, 1);
    sketchLine(x+22, y-4, x+34, y-22, p.seed+7, 1);
    scribbleText('your bookmark', x+p.w/2, y+40, 13, {color:'#4f9e58', alpha:0.7});
  }
  ctx.globalAlpha = 1;
}
const BUBBLE_COLS = {
  norm:   ()=> [PAL().bubble, INK],
  red:    ()=> ['#d66969', '#b64a4a'],
  yellow: ()=> ['#e2c33c', '#b0902a'],
  green:  ()=> ['#7fb85a', '#5a8f3c'],
  purple: ()=> ['#a97fd4', '#7c56a8']
};
function drawBubble(b){
  if(b.popped) return;
  const x = bubXAt(b, time);
  const y = sy(bubYAt(b));
  if(y < -60 || y > H+60) return;
  const wobble = (b.wobbleT>0 ? Math.sin(time*40)*3*b.wobbleT : 0);
  const danger = b.timer>0 && b.timer < 3;
  const shiver = danger ? Math.sin(time*30)*2.5 : 0;
  const r = b.r + wobble + shiver*0.5;
  const bob = Math.sin(time*1.5 + b.seed)*3;
  const cols = (BUBBLE_COLS[b.kind] || BUBBLE_COLS.norm)();
  hatchCircle(x, y+bob, r-3, cols[0], b.kind && b.kind!=='norm' ? 0.5 : 0.35);
  pencil(0.9, 2, cols[1]);
  sketchCircle(x + shiver, y+bob, r, b.seed);
  // shine
  pencil(0.55, 1.6, cols[1]);
  ctx.beginPath();
  ctx.arc(x - r*0.35, y+bob - r*0.3, r*0.35, Math.PI*0.9, Math.PI*1.5);
  ctx.stroke();
  // tiny doodles that hint what special bubbles do
  if(b.kind==='yellow'){ pencil(0.75,1.6,cols[1]); sketchLine(x-6,y+bob+5,x,y+bob-7,b.seed+8,0.6); sketchLine(x,y+bob-7,x+6,y+bob+5,b.seed+9,0.6); }
  if(b.kind==='green'){ pencil(0.75,1.6,cols[1]); sketchLine(x,y+bob+6,x,y+bob-7,b.seed+8,0.6); sketchLine(x-5,y+bob-1,x,y+bob-7,b.seed+9,0.6); sketchLine(x+5,y+bob-1,x,y+bob-7,b.seed+10,0.6); }
  // countdown arc (pencil timer)
  if(b.timer > 0){
    const life = b.kind === 'purple' ? 5 : bubbleLife();
    pencil(0.85, 3, danger ? '#d66969' : '#4a86c9');
    ctx.beginPath();
    ctx.arc(x, y+bob, r+7, -Math.PI/2, -Math.PI/2 + (b.timer/life)*Math.PI*2);
    ctx.stroke();
    if(danger) scribbleText(Math.ceil(b.timer), x, y+bob, 20, {color:'#d66969', bold:true});
  }
  ctx.globalAlpha = 1;
}
function drawFinish(p){
  const x = p.x - p.w/2, y = sy(p.y);
  if(y < -120 || y > H+120) return;
  hatchRect(x, y, p.w, p.h, '#c9931f', 0.4);
  pencil(0.95, 2.4);
  sketchRect(x, y, p.w, p.h, p.seed);
  // flag
  const fx = p.x + p.w/2 - 30;
  sketchLine(fx, y, fx, y-58, p.seed+1);
  hatchRect(fx, y-58, 34, 20, '#d66969', 0.6);
  sketchRect(fx, y-58, 34, 20, p.seed+2);
  // chest waiting on the ledge (ghosted after its one opening)
  if(level && level.chestOpenedBefore){
    ctx.globalAlpha = 0.35;
    drawChest(p.x - 40, y - 8, 46, p.seed+10, true);
    ctx.globalAlpha = 1;
  } else {
    drawChest(p.x - 40, y - 8, 46, p.seed+10, false);
  }
  scribbleText('FINISH!', p.x, y - 78, 22, {color:'#d66969', bold:true, rot:-0.04});
}
/* ---- hazards ---- */
function drawBirds(){
  for(const b of level.birds){
    const y = sy(b.y);
    if(y < -40 || y > H+40) continue;
    const x = birdX(b, time);
    const flap = Math.sin(time*14 + b.phase)*6;
    pencil(0.9, 2.2);
    ctx.fillStyle = INK; ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.ellipse(x, y, 11, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    sketchLine(x - 8, y - 4, x - 18, y - 10 - flap, b.phase*10, 1);
    sketchLine(x + 8, y - 4, x + 18, y - 10 + flap, b.phase*10+1, 1);
    pencil(0.9, 1.8, '#e2b33c');
    sketchLine(x + 10*b.dir, y, x + 16*b.dir, y + 2, b.phase*10+2, 0.5);
  }
}
function drawSpinners(){
  for(const s of level.spinners){
    const y = sy(s.y);
    if(y < -80 || y > H+80) continue;
    const a = time*s.speed + s.phase;
    pencil(0.9, 2.2);
    sketchCircle(s.x, y, 10, s.phase*100);
    for(const off of [0, Math.PI]){
      const tx = s.x + Math.cos(a+off)*s.len, ty = y + Math.sin(a+off)*s.len;
      sketchLine(s.x, y, tx, ty, s.phase*100+1+off, 1);
      pencil(0.85, 2, '#d66969');
      sketchCircle(tx, ty, 7, s.phase*100+2+off);
      pencil(0.9, 2.2);
    }
  }
}
function drawEraser(){
  const er = level.eraser;
  if(!er || !er.active) return;
  const y = sy(er.y);
  if(y > H + 120) return;
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = '#e8a7b8';
  ctx.fillRect(0, Math.max(-10,y), W, H - Math.max(-10,y) + 40);
  ctx.globalAlpha = 1;
  hatchRect(0, y, W, 26, '#c9788f', 0.5);
  pencil(0.95, 2.6, '#9c5c72');
  sketchLine(0, y, W, y, 777, 2.4);
  for(let i=0;i<8;i++){
    const cx = ((rnd(9,i) * W + time*30*(i%2?1:-1)) % W + W) % W;
    pencil(0.5, 2, '#c9788f');
    sketchLine(cx, y - 6 - rnd(10,i)*14, cx+5, y - 4 - rnd(10,i)*14, 778+i, 1);
  }
  scribbleText('the eraser is coming!', W/2, y - 18, 15, {color:'#9c5c72', alpha:0.8});
}
function drawWindBands(){
  for(const wband of level.wind){
    const y1 = sy(wband.y1), y2 = sy(wband.y2);
    if(y2 < 0 || y1 > H) continue;
    const top = Math.max(y1, 0), bot = Math.min(y2, H);
    for(let i=0;i<6;i++){
      const yy = top + rnd(31,i) * Math.max(30, bot - top);
      const xx = ((rnd(32,i)*W + time*80*wband.dir) % W + W) % W;
      pencil(0.3, 1.8);
      ctx.beginPath();
      ctx.moveTo(xx - 18*wband.dir, yy);
      ctx.quadraticCurveTo(xx, yy - 6, xx + 14*wband.dir, yy);
      ctx.stroke();
      sketchLine(xx + 14*wband.dir, yy, xx + 8*wband.dir, yy - 5, 33+i, 0.5);
    }
  }
  ctx.globalAlpha = 1;
}

/* ---- more collectible icons ---- */
function drawStar(x,y,s,seed){
  pencil(0.95, 2, '#c9931f');
  ctx.beginPath();
  for(let i=0;i<=10;i++){
    const a = -Math.PI/2 + i*Math.PI/5;
    const rr = (i%2===0 ? s : s*0.45) + jit(seed,i,1);
    const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#e2c33c'; ctx.fill();
  ctx.globalAlpha = 0.95; ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawPiece(x,y,s,seed,tint){
  hatchRect(x-s/2, y-s/2, s, s, tint || '#8a6bc1', 0.5);
  pencil(0.95, 2);
  sketchRect(x-s/2, y-s/2, s, s, seed);
  sketchCircle(x, y-s/2, s*0.22, seed+1);        // puzzle nub top
  sketchCircle(x+s/2, y, s*0.22, seed+2);        // puzzle nub right
}
function drawDrop(x,y,s,seed){
  const cols = ['#d66969','#e2b33c','#4f9e58','#4a86c9','#8a6bc1'];
  for(let i=0;i<5;i++){
    pencil(0.85, 2, cols[i]);
    ctx.beginPath();
    ctx.arc(x, y + s*0.2, s*(0.9 - i*0.14), Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
  }
  pencil(0.95, 2, '#4a86c9');
  ctx.beginPath();
  ctx.moveTo(x, y - s*0.9);
  ctx.quadraticCurveTo(x + s*0.75, y + s*0.35, x, y + s*0.6);
  ctx.quadraticCurveTo(x - s*0.75, y + s*0.35, x, y - s*0.9);
  ctx.stroke();
}
function drawWanderChest(it, y){
  const shake = it.kind === 'rainbow' ? Math.sin(time*6)*2 : 0;
  drawChest(it.x + shake, y, 42, it.seed, false);
  // little padlock + ribbon color hints the chest type (contents stay secret!)
  const ribbon = it.kind === 'rainbow' ? '#8a6bc1' : it.kind === 'piece' ? (CHARACTERS[it.char] ? CHARACTERS[it.char].tint : '#d66969') : '#4a86c9';
  hatchRect(it.x - 4, y - 24, 8, 10, ribbon, 0.8);
  pencil(0.85, 1.8);
  sketchRect(it.x - 5, y - 2, 10, 9, it.seed+20);
  ctx.beginPath(); ctx.arc(it.x, y - 2, 4, Math.PI, 0); ctx.stroke();
  if(it.kind === 'rainbow') drawDrop(it.x + 24, y - 22, 9, it.seed+30);
}

/* ---- collectibles in world (ghosted once collected forever) ---- */
function drawItem(it){
  const y = sy(it.y) + Math.sin(time*2 + it.phase)*4;
  if(y < -50 || y > H+50) return;
  if(it.taken && !it.ghost) return;                 // grabbed this round: gone
  if(it.ghost){
    // faint grey memory + a little tick: "you already got this one"
    ctx.save();
    ctx.globalAlpha = 0.32;
    const gi = INK;
    pencil(0.8, 1.8, gi);
    if(it.t==='chest') sketchRect(it.x-16, y-12, 32, 22, it.seed);
    else sketchCircle(it.x, y, it.t==='coin' ? 10 : 14, it.seed);
    pencil(1, 2.2, '#4f9e58');
    ctx.globalAlpha = 0.55;
    sketchLine(it.x-5, y+1, it.x-1, y+5, it.seed+3, 0.6);
    sketchLine(it.x-1, y+5, it.x+6, y-5, it.seed+4, 0.6);
    ctx.restore();
    ctx.globalAlpha = 1;
    return;
  }
  if(it.t==='coin') drawCoin(it.x, y, 11, it.seed);
  if(it.t==='key') drawKey(it.x, y, 22, it.seed);
  if(it.t==='magnet') drawMagnet(it.x, y, 18, it.seed);
  if(it.t==='colorbox') drawColorBox(it.x, y, 24, it.seed);
  if(it.t==='star') drawStar(it.x, y, 13, it.seed);
  if(it.t==='piece') drawPiece(it.x, y, 20, it.seed, CHARACTERS[it.char] && CHARACTERS[it.char].tint);
  if(it.t==='drop') drawDrop(it.x, y, 12, it.seed);
  if(it.t==='chest') drawWanderChest(it, y);
}

/* ---- the girls ---- */
function drawGirl(x, y, ch, scale, squash, limbs, opts){
  opts = opts || {};
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * (2-squash) * (opts.flip||1), scale * squash);
  const seed = ch.name.length * 31;

  // legs & arms (verlet-driven if provided, posed if not)
  pencil(0.95, 2.6);
  if(limbs){
    ctx.restore(); ctx.save();   // limbs live in world space
    pencil(0.95, 2.6);
    for(const key of ['legL','legR']){
      const l = limbs[key];
      if(l.init){
        sketchLine(x + (key==='legL'?-6:6)*scale, y+12*scale, l.e.x, l.e.y, seed+(key==='legL'?1:2), 1);
        sketchLine(l.e.x, l.e.y, l.h.x, l.h.y, seed+(key==='legL'?3:4), 1);
        // little shoe scribble
        pencil(0.85, 2);
        sketchLine(l.h.x-4, l.h.y+2, l.h.x+5, l.h.y+2, seed+5, 0.8);
        pencil(0.95, 2.6);
      }
    }
    for(const key of ['armL','armR']){
      const l = limbs[key];
      if(l.init){
        sketchLine(x + (key==='armL'?-11:11)*scale, y-4*scale, l.e.x, l.e.y, seed+(key==='armL'?6:7), 1);
        sketchLine(l.e.x, l.e.y, l.h.x, l.h.y, seed+(key==='armL'?8:9), 1);
        sketchCircle(l.h.x, l.h.y, 3, seed+10);
      }
    }
    ctx.restore(); ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale*(2-squash)*(opts.flip||1), scale*squash);
  } else {
    sketchLine(-6,12, -8,26, seed+1,1); sketchLine(-8,26,-9,36, seed+2,1);
    sketchLine(6,12, 8,26, seed+3,1);  sketchLine(8,26,9,36, seed+4,1);
    sketchLine(-11,-4, -17,6, seed+5,1); sketchLine(-17,6,-19,14, seed+6,1);
    sketchLine(11,-4, 17,6, seed+7,1);  sketchLine(17,6,19,14, seed+8,1);
  }

  // body / outfit
  const dressy = ch.shirt==='dots' || ch.shirt==='flower' || ch.shirt==='star';
  if(dressy){
    ctx.save();
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(-15,16); ctx.lineTo(15,16); ctx.closePath(); ctx.clip();
    ctx.globalAlpha=0.3; ctx.fillStyle=ch.tint; ctx.fillRect(-16,-8,32,26);
    if(ch.shirt==='dots'){
      ctx.globalAlpha=0.8; ctx.fillStyle=ch.tint;
      for(let dy2=-4; dy2<16; dy2+=7) for(let dx2=-12; dx2<14; dx2+=7)
        ctx.fillRect(dx2 + (dy2%14? 3:0), dy2, 2.5, 2.5);
    }
    ctx.restore(); ctx.globalAlpha=1;
    pencil(0.95, 2.2);
    sketchLine(0,-8,-15,16, seed+11,1); sketchLine(-15,16,15,16, seed+12,1); sketchLine(15,16,0,-8, seed+13,1);
    if(ch.shirt==='flower'){
      pencil(0.9, 1.6, '#fbf0f5');
      for(let i=0;i<5;i++){ const a=i*Math.PI*2/5; sketchCircle(Math.cos(a)*4, 5+Math.sin(a)*4, 2.4, seed+30+i); }
      pencil(0.9, 1.8, '#e2b33c'); sketchCircle(0, 5, 2, seed+36);
    }
    if(ch.shirt==='star'){
      pencil(0.95, 1.8, '#f5e6b8');
      ctx.beginPath();
      for(let i=0;i<=10;i++){ const a=-Math.PI/2+i*Math.PI/5; const rr=(i%2?2.4:5.5); const px=Math.cos(a)*rr, py=5+Math.sin(a)*rr; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
      ctx.closePath(); ctx.stroke();
    }
  } else {
    hatchRect(-11,-8, 22, 22, ch.tint, 0.35);
    pencil(0.95, 2.2);
    sketchRect(-11,-8, 22, 22, seed+11);
    if(ch.shirt==='stripes'){
      pencil(0.75, 1.8);
      for(let i=-6;i<=6;i+=6) sketchLine(i,-8, i,14, seed+12+i, 0.7);
    }
    if(ch.shirt==='zigzag'){
      pencil(0.85, 1.8);

/* locked girls show only their OUTER outline — a pure solid shadow.
   We draw the girl offscreen, threshold her alpha, then flood-fill the
   outside so every enclosed hole (shirt icons, hair gaps, face) becomes
   part of one flat shape. The reveal is the reward. */
let silCache = {};
function drawGirlSilhouette(x, y, chId, scale){
  const key = chId + '|' + savePaperKey();
  let c = silCache[key];
  if(!c){
    c = document.createElement('canvas');
    c.width = 96; c.height = 128;
    const sc = c.getContext('2d');
    const main = ctx;
    ctx = sc;
    ctx.translate(48, 82);
    drawGirl(0, 0, CHARACTERS[chId], 1, 1, null, {mood:'smile'});
    ctx.setTransform(1,0,0,1,0,0);
    ctx = main;
    const Wp = 96, Hp = 128;
    const img = sc.getImageData(0, 0, Wp, Hp);
    const a = img.data;
    const solid = new Uint8Array(Wp*Hp);
    for(let i=0;i<Wp*Hp;i++) solid[i] = a[i*4+3] > 12 ? 1 : 0;
    // flood the OUTSIDE from every border pixel; whatever isn't reached is her
    const outside = new Uint8Array(Wp*Hp);
    const stack = [];
    for(let xx=0; xx<Wp; xx++){ stack.push(xx, xx + (Hp-1)*Wp); }
    for(let yy=0; yy<Hp; yy++){ stack.push(yy*Wp, yy*Wp + Wp-1); }
    while(stack.length){
      const i = stack.pop();
      if(i < 0 || i >= Wp*Hp || outside[i] || solid[i]) continue;
      outside[i] = 1;
      const xx = i % Wp;
      if(xx > 0) stack.push(i-1);
      if(xx < Wp-1) stack.push(i+1);
      stack.push(i-Wp, i+Wp);
    }
    const col = savePaperKey() === 'chalk' ? [215,222,215] : [152,160,172];
    for(let i=0;i<Wp*Hp;i++){
      a[i*4] = col[0]; a[i*4+1] = col[1]; a[i*4+2] = col[2];
      a[i*4+3] = outside[i] ? 0 : 235;
    }
    sc.putImageData(img, 0, 0);
    silCache[key] = c;
  }
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.drawImage(c, x - 48*scale, y - 82*scale, 96*scale, 128*scale);
  ctx.restore();
}

function worldLimbs(){
  // limbs are stored in world coords; shift to screen coords for drawing
  const out = {};
  for(const k in player.limbs){

  }
  return out;
}
