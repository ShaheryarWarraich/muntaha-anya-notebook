/* ---- level map: a pencil trail up the page ---- */
function drawMap(){
  drawPaper(-time*10);
  scribbleText('Pick a page!', W/2, 60, 34, {bold:true, rot:-0.02});
  const pos = [];
  for(let lv=1; lv<=20; lv++){
    const row = Math.floor((lv-1)/4);
    const col = (lv-1)%4;
    const x = (row%2===0) ? 80 + col*107 : 401 - col*107;   // snake up the page
    const y = 690 - row*128;
    pos.push({lv,x,y});
  }
  // dotted trail (trimmed so it never crosses the page-number circles)
  pencil(0.4, 2);
  for(let i=0;i<pos.length-1;i++){
    const a = pos[i], b = pos[i+1];
    const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1;
    const ax = a.x + dx/len*32, ay = a.y + dy/len*32;
    const bx = b.x - dx/len*32, by = b.y - dy/len*32;
    const steps = 4;
    for(let s=0;s<steps;s+=2){
      const t1 = s/steps, t2 = (s+1)/steps;
      sketchLine(ax+(bx-ax)*t1, ay+(by-ay)*t1, ax+(bx-ax)*t2, ay+(by-ay)*t2, i*10+s, 1);
    }
  }
  for(const nd of pos){
    const done = save.levelsDone[nd.lv];
    const open = nd.lv <= save.levelReached;
    const isNext = nd.lv === save.levelReached && !done;
    if(done) hatchCircle(nd.x, nd.y, 22, '#4f9e58', 0.35);
    else if(open) hatchCircle(nd.x, nd.y, 22, '#e2b33c', 0.3);
    pencil(open?0.95:0.4, isNext?3:2, open?INK:undefined);
    sketchCircle(nd.x, nd.y, 24 + (isNext ? Math.sin(time*4)*2.5 : 0), nd.lv*3);
    scribbleText(nd.lv, nd.x, nd.y+1, 20, {bold:open, alpha:open?1:0.4});
    if(done){
      pencil(1, 2.6, '#4f9e58');
      sketchLine(nd.x+12, nd.y-16, nd.x+17, nd.y-10, nd.lv*3+1, 1);
      sketchLine(nd.x+17, nd.y-10, nd.x+26, nd.y-24, nd.lv*3+2, 1);
    }
    if(!open){
      pencil(0.45, 1.6);
      sketchRect(nd.x-7, nd.y+26, 14, 11, nd.lv*3+3);
      ctx.beginPath(); ctx.arc(nd.x, nd.y+26, 5, Math.PI, 0); ctx.stroke();
    }
    if(save.bestTime[nd.lv])
      scribbleText(fmtTime(save.bestTime[nd.lv]), nd.x, nd.y+38, 11, {alpha:0.55, color:'#4a86c9'});
    if(open) uiButtons.push({x:nd.x-26, y:nd.y-26, w:52, h:52, cb:()=>{ startRound(nd.lv); }});
  }
  drawButton('back', 20, H-58, 90, 40, ()=>{ state='title'; }, {size:16});
  scribbleText('playing as ' + (CHARACTERS[save.selected]||CHARACTERS.muntaha).name, W-150, H-64, 14, {alpha:0.6});
}

/* ---- character select: the whole crew ---- */
let selInfo = null;
function drawSelect(){
  drawPaper(0);
  scribbleText('Who’s jumping?', W/2, 56, 32, {bold:true, rot:-0.02});
  const roster = KNOWN_ORDER.slice();
  if(save.secretsRevealed || save.unlocked.doodle) roster.push('doodle');
  if(save.secretsRevealed || save.unlocked.inky) roster.push('inky');
  roster.forEach((id, i)=>{
    const ch = CHARACTERS[id];
    const col = i%3, row = Math.floor(i/3);
    const x = 26 + col*146, w = 134, h = 148;
    const y = 88 + row*160;
    const unlocked = !!save.unlocked[id];
    const sel = save.selected === id;
    const isSecretCard = ch.secret && !unlocked;
    ctx.globalAlpha = unlocked ? 0.92 : 0.6;
    ctx.fillStyle = sel ? '#fdf4d8' : PAPER().hud;
    ctx.fillRect(x,y,w,h); ctx.globalAlpha = 1;
    pencil(sel?1:0.6, sel?3:2, sel?'#c9931f':INK);
    sketchRect(x,y,w,h, 70+i);
    if(isSecretCard){
      scribbleText('?', x+w/2, y+62, 44, {alpha:0.35, bold:true});
      scribbleText('a secret friend...', x+w/2, y+120, 12, {alpha:0.45});
    } else if(unlocked){
      drawGirl(x+w/2, y+78, ch, 1.15, 1, null, {mood: sel?'grin':'smile'});
      scribbleText(ch.name, x+w/2, y+126, 18, {bold:true, color:ch.tint});
    } else {
      drawGirlSilhouette(x+w/2, y+72, id, 1.05);
      pencil(0.6,1.8);
      sketchRect(x+w-28, y+8, 16, 12, 85+i);
      ctx.beginPath(); ctx.arc(x+w-20, y+8, 6, Math.PI, 0); ctx.stroke();
      scribbleText(ch.name, x+w/2, y+112, 16, {alpha:0.6, bold:true});
      if(ch.needPieces) scribbleText('▣'.repeat(save.pieces[id]||0) + '□'.repeat(Math.max(0, ch.needPieces-(save.pieces[id]||0))), x+w/2, y+132, 14, {color:ch.tint});
    }
    uiButtons.push({x,y,w,h, cb:()=>{
      selInfo = id;
      if(unlocked){ save.selected = id; persist(); SFX.coin(); }
    }});
  });
  // info strip: tapped girl's power (or how to free her)
  const iy = 88 + Math.ceil(roster.length/3)*160 + 4;
  if(selInfo && save.unlocked[selInfo]){
    const ch = CHARACTERS[selInfo];
    ctx.globalAlpha = 0.92; ctx.fillStyle = PAPER().hud; ctx.fillRect(20, iy, W-40, 96); ctx.globalAlpha = 1;
    pencil(0.8, 2, ch.tint); sketchRect(20, iy, W-40, 96, 300);
    scribbleText(ch.name + '’s power:', W/2, iy+26, 17, {bold:true, color:ch.tint});
    scribbleText(ch.desc, W/2, iy+52, 16);
    if(save.selected === selInfo)
      scribbleText('✓ she’s ready to jump!', W/2, iy+78, 13, {color:'#4f9e58'});
  } else if(selInfo && !save.unlocked[selInfo]){
    const ch = CHARACTERS[selInfo];
    ctx.globalAlpha = 0.92; ctx.fillStyle = PAPER().hud; ctx.fillRect(20, iy, W-40, 96); ctx.globalAlpha = 1;
    pencil(0.8, 2); sketchRect(20, iy, W-40, 96, 300);
    if(ch.secret){
      scribbleText('shhh... you’ll know her when you find her!', W/2, iy+48, 16, {alpha:0.7});
    } else {
      scribbleText('How to unlock ' + ch.name + ':', W/2, iy+22, 16, {bold:true});
      scribbleText(ch.hint, W/2, iy+46, 14, {alpha:0.8});
      if(ch.price){
        const afford = save.coins >= ch.price;
        scribbleText('or buy: ' + ch.price + ' coins', W/2 - 60, iy+74, 14, {color:afford?'#4f9e58':'#d66969'});
        if(afford) drawButton('BUY!', W/2 + 60, iy+58, 90, 32, ()=>{
          save.coins -= ch.price; save.unlocked[selInfo] = true; persist();
          celebration = {char:selInfo}; stateReturn = 'select'; state = 'friend'; SFX.chest();
        }, {size:16, ink:'#4f9e58'});
      }
    }
  } else {
    scribbleText('finish quest boards, open chests, brave the risky routes!', W/2, iy+30, 13, {alpha:0.55});
  }
  drawButton('back', 20, H-58, 90, 40, ()=>{ selInfo=null; state='title'; }, {size:16});
  drawButton('PLAY!', W-170, H-66, 150, 50, ()=>{ selInfo=null; state='map'; }, {size:22, ink:'#4f9e58'});
}

/* ---- shop: friends + places ---- */
let shopInfo = null;
function drawShop(){
  drawPaper(0);
  scribbleText('The Shop', W/2, 54, 34, {bold:true, rot:-0.02});
  drawCoin(W/2-52, 88, 10, 45);
  scribbleText(save.coins + ' coins', W/2+14, 88, 17, {bold:true});
  // friends for (a lot of) coins
  scribbleText('friends (earning them is cheaper!):', W/2, 128, 15, {alpha:0.7});
  const buyable = ['zoya','aisha','lily','luna'].filter(id=>!save.unlocked[id]);
  if(!buyable.length) scribbleText('all your known friends are unlocked! 🎉', W/2, 170, 15, {color:'#4f9e58'});
  buyable.forEach((id,i)=>{
    const ch = CHARACTERS[id];
    const x = 30 + i*108, y = 146, w = 98, h = 128;
    ctx.globalAlpha = 0.7; ctx.fillStyle = PAPER().hud; ctx.fillRect(x,y,w,h); ctx.globalAlpha = 1;
    pencil(0.6, 2); sketchRect(x,y,w,h, 400+i);
    drawGirlSilhouette(x+w/2, y+56, id, 0.9);
    scribbleText(ch.name, x+w/2, y+92, 14, {bold:true});
    const afford = save.coins >= ch.price;
    scribbleText(ch.price, x+w/2, y+112, 14, {color:afford?'#4f9e58':'#d66969', bold:true});
    uiButtons.push({x,y,w,h, cb:()=>{
      if(afford){
        save.coins -= ch.price; save.unlocked[id] = true; persist();
        celebration = {char:id}; stateReturn = 'shop'; state = 'friend'; SFX.chest();
      } else floatText('not enough coins yet!', W/2, 300, '#d66969');
    }});
  });
  // places (paper styles)
  scribbleText('places (new paper for the whole game!):', W/2, 316, 15, {alpha:0.7});
  Object.keys(PAPERS).forEach((k,i)=>{
    const pp = PAPERS[k];
    const col = i%3, row = Math.floor(i/3);
    const x = 40 + col*140, y = 336 + row*118, w = 122, h = 100;
    const owned = save.papers.includes(k);
    const active = save.selectedPaper === k;
    ctx.globalAlpha = 0.95; ctx.fillStyle = pp.bg; ctx.fillRect(x,y,w,h); ctx.globalAlpha = 1;
    ctx.strokeStyle = pp.line; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let yy=y+16; yy<y+h; yy+=14){ ctx.moveTo(x+4,yy); ctx.lineTo(x+w-4,yy); }
    ctx.stroke();
    pencil(active?1:0.6, active?3:2, active?'#c9931f':INK);
    sketchRect(x,y,w,h, 500+i);
    scribbleText(pp.name, x+w/2, y+30, 13, {bold:true, color:pp.ink});
    if(active) scribbleText('★ in use', x+w/2, y+56, 12, {color:'#c9931f'});
    else if(owned) scribbleText('tap to use!', x+w/2, y+56, 12, {color:pp.ink, alpha:0.7});
    else scribbleText(pp.price + ' coins', x+w/2, y+56, 13, {color:save.coins>=pp.price?'#4f9e58':'#d66969', bold:true});
    uiButtons.push({x,y,w,h, cb:()=>{
      if(owned){ save.selectedPaper = k; persist(); applyPaper(); SFX.colorbox(); }
      else if(save.coins >= pp.price){ save.coins -= pp.price; save.papers.push(k); save.selectedPaper = k; persist(); applyPaper(); SFX.chest(); }
      else floatText('not enough coins yet!', W/2, 300, '#d66969');
    }});
  });
  drawButton('back', 20, H-58, 90, 40, ()=>{ state='title'; }, {size:16});
}

function drawPlay(){
  drawPaper(camY);
  drawWindBands();
  for(const p of level.plats){
    if(p.type==='plat') drawPlat(p);
    else if(p.type==='bubble') drawBubble(p);
    else if(p.type==='bookmark') drawBookmark(p);
    else if(p.type==='finish') drawFinish(p);
  }
  for(const it of level.items) drawItem(it);
  drawSpinners();
  drawBirds();
  drawPlayer();
  drawEraser();
  drawFX();
  drawHUD();
  scribbleText(Math.max(0,-Math.round(player.y/10)) + ' m', W-36, 86, 16, {alpha:0.55});
}

/* ---- wandering-chest reveal ---- */
function drawChestScreen(){
  drawPlay();
  ctx.globalAlpha = 0.8; ctx.fillStyle = PAPER().bg; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
  if(!chestReveal.start) chestReveal.start = time;
  const t = time - chestReveal.start;
  const open = t > 0.9;
  const shakeX = open ? 0 : Math.sin(time*40)*4*(0.9-t);
  drawChest(W/2 + shakeX, 320, 110, 200, open);
  if(open){
    // rays + reveal
    pencil(0.4, 2, '#e2b33c');
    for(let i=0;i<8;i++){
      const a = i*Math.PI/4 + time*0.4;
      sketchLine(W/2 + Math.cos(a)*80, 300 + Math.sin(a)*80, W/2 + Math.cos(a)*130, 300 + Math.sin(a)*130, 600+i, 1.4);
    }
    chestReveal.lines.forEach((ln, i)=>{
      scribbleText(ln, W/2, 420 + i*34, i===0?26:20, {bold:i===0, color:i===0?'#c9931f':INK});
    });
    drawButton('YAY!', W/2-80, 560, 160, 54, ()=>{ chestReveal=null; state=stateReturn; }, {size:24, ink:'#4f9e58'});
  } else {
    scribbleText('opening...', W/2, 430, 20, {alpha:0.7});
  }
}

/* ---- NEW FRIEND celebration ---- */
function drawFriend(){
  if(!celebration){ state = 'title'; return; }
  drawPaper(time*-40);
  const ch = CHARACTERS[celebration.char];
  for(let i=0;i<18;i++){
    const cx = 30+rnd(21,i)*420, cyy = ((rnd(22,i)*800 + time*80)%820);
    pencil(0.75, 2.2, ['#e2699e','#4a86c9','#e2b33c','#4f9e58','#8a6bc1'][i%5]);
    sketchLine(cx, cyy, cx+9, cyy+9, 100+i, 1.5);
  }
  scribbleText('NEW FRIEND!', W/2, 140, 46, {bold:true, color:'#4f9e58', rot:-0.03, outline:true});
  const hop = Math.abs(Math.sin(time*3))*30;
  drawGirl(W/2, 360 - hop, ch, 2.1, 1, null, {mood:'grin'});
  pencil(0.5,2); sketchLine(W/2-90, 392, W/2+90, 392, 61, 2);
  scribbleText(ch.name + '!', W/2, 452, 38, {bold:true, color:ch.tint});
  scribbleText(ch.desc, W/2, 492, 18, {alpha:0.85});
  if(ch.secret) scribbleText('(she was hiding in the notebook all along!)', W/2, 520, 14, {alpha:0.6});
  drawButton('PLAY AS HER!', W/2-190, 560, 180, 54, ()=>{
    save.selected = celebration.char; persist();
    celebration = null; state = stateReturn; SFX.coin();
  }, {size:19, ink:'#4f9e58'});
  drawButton('later', W/2+30, 560, 160, 54, ()=>{ celebration = null; state = stateReturn; }, {size:19});
}

/* ---- soft bookmark-fall screen ---- */
function drawFell(){
  drawPlay();
  ctx.globalAlpha = 0.75; ctx.fillStyle = PAPER().bg; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
  scribbleText('Wheee... oops!', W/2, 210, 40, {bold:true, color:'#d66969', rot:-0.03});
  scribbleText('Your bookmark saved your spot!', W/2, 260, 20, {color:'#4f9e58'});
  // bookmark doodle
  hatchRect(W/2-24, 300, 48, 84, '#4f9e58', 0.5);
  pencil(0.95, 2.4);
  sketchRect(W/2-24, 300, 48, 84, 700);
  sketchLine(W/2-24, 384, W/2, 360, 701, 1);
  sketchLine(W/2, 360, W/2+24, 384, 702, 1);
  scribbleText('everything you collected is kept', W/2, 424, 15, {alpha:0.7});
  scribbleText('⏱ ' + fmtTime(roundTime) + ' — the clock is still ticking!', W/2, 450, 14, {alpha:0.6});
  drawButton('JUMP BACK IN!', W/2-110, 496, 220, 58, ()=>{ respawnAtBookmark(); }, {size:22, ink:'#4f9e58'});
  drawButton('map', W/2-60, 574, 120, 42, ()=>{ state='map'; }, {size:17});
}

function drawWin(){
  drawPlay();
  ctx.globalAlpha = 0.84; ctx.fillStyle = PAPER().bg; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
  scribbleText('LEVEL ' + curLevel + ' COMPLETE!', W/2, 130, 38, {bold:true, color:'#4f9e58', rot:-0.03});
  for(let i=0;i<14;i++){
    const cx = 40+rnd(21,i)*400, cyy = 170 + ((rnd(22,i)*400 + time*60)%460);
    pencil(0.7, 2, ['#e2699e','#4a86c9','#e2b33c','#4f9e58'][i%4]);
    sketchLine(cx, cyy, cx+8, cyy+8, 100+i, 1.4);
  }
  if(winTimeInfo){
    scribbleText('⏱ ' + fmtTime(winTimeInfo.t) + (winTimeInfo.isNew ? '  —  NEW BEST!' : '   (best ' + fmtTime(save.bestTime[curLevel]) + ')'),
      W/2, 175, winTimeInfo.isNew ? 22 : 17,
      {bold:winTimeInfo.isNew, color:winTimeInfo.isNew ? '#c9931f' : INK, alpha:winTimeInfo.isNew?1:0.75});
  }
  drawChest(W/2, 290, 84, 200, chestResult && (chestResult.opened || chestResult.ghost));
  if(chestResult && chestResult.opened){
    scribbleText('a key opened the chest!', W/2, 352, 19, {color:'#c9931f'});
    scribbleText('+' + chestResult.coins + ' coins!', W/2, 382, 28, {bold:true, color:'#c9931f'});
  } else if(chestResult && chestResult.ghost){
    scribbleText('this chest was already opened', W/2, 352, 16, {alpha:0.55});
    scribbleText('(one treasure per page!)', W/2, 376, 14, {alpha:0.5});
  } else {
    scribbleText('the chest is locked...', W/2, 352, 19, {alpha:0.7});
    scribbleText('bring a key next time!', W/2, 378, 16, {alpha:0.6});
  }
  scribbleText('coins this round: ' + roundCoins + '   height: ' + heightClimbed + ' m', W/2, 434, 16, {alpha:0.8});
  if(curLevel < 20 && save.levelReached > curLevel){
    drawButton('NEXT LEVEL →', W/2-115, 476, 230, 58, ()=>{ startRound(curLevel+1); }, {size:23, ink:'#4f9e58'});
    drawButton('replay', W/2-140, 552, 130, 44, ()=>{ startRound(curLevel); }, {size:17});
    drawButton('map', W/2+10, 552, 130, 44, ()=>{ state='map'; }, {size:17});
  } else {
    drawButton('PLAY AGAIN', W/2-110, 476, 220, 56, ()=>{ startRound(curLevel); }, {size:23, ink:'#4f9e58'});
    drawButton('map', W/2-60, 550, 120, 44, ()=>{ state='map'; }, {size:17});
  }
  if(curLevel === 20) scribbleText('YOU CLIMBED THE WHOLE NOTEBOOK!!', W/2, 630, 20, {color:'#8a6bc1', bold:true});
}

function drawDead(){
  drawPlay();
  ctx.globalAlpha = 0.78; ctx.fillStyle = PAPER().bg; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
  scribbleText('Whoops!', W/2, 200, 48, {bold:true, color:'#d66969', rot:-0.04});
  scribbleText('You slipped off the page!', W/2, 250, 22);
  drawGirl(W/2, 340, CHARACTERS[save.selected]||CHARACTERS.muntaha, 1.6, 1, null, {mood:'oh'});
  scribbleText('height: ' + heightClimbed + ' m   coins kept: +' + roundCoins, W/2, 430, 17, {alpha:0.8});
  scribbleText('reach a bookmark ledge to save your spot!', W/2, 460, 16, {color:'#4f9e58'});
  drawButton('TRY AGAIN', W/2-110, 510, 220, 58, ()=>{ startRound(curLevel); }, {size:26, ink:'#4f9e58'});
  drawButton('map', W/2-60, 590, 120, 44, ()=>{ state='map'; }, {size:18});
}

/* ---------------- main loop -------------------------------- */
let last = performance.now();
function frame(now){
  let dt = Math.min(0.033, (now-last)/1000);
  last = now;
  update(dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shake>0) ctx.translate(jit(1,wob,4), jit(2,wob,4));
  uiButtons = [];
  if(state==='who') drawWho();
  else if(state==='title') drawTitle();
  else if(state==='map') drawMap();
  else if(state==='select') drawSelect();
  else if(state==='shop') drawShop();
  else if(state==='play') drawPlay();
  else if(state==='win') drawWin();
  else if(state==='dead') drawDead();
  else if(state==='fell') drawFell();
  else if(state==='chest') drawChestScreen();
  else if(state==='friend') drawFriend();

  // floaties on menu screens too (shop "not enough coins" etc.)
  if(state!=='play' && state!=='win' && state!=='dead' && state!=='fell' && state!=='chest'){
    for(const f of floaties)
      scribbleText(f.txt, f.x, f.y, 17, {color:f.color, bold:true, outline:true, alpha:Math.min(1,f.life*1.5)});
    floaties = floaties.filter(f=>{ f.y -= 1; f.life -= dt; return f.life > 0; });
  }

  // sound toggles on menus too
  if(state!=='play'){
    uiButtons.push({x:W-78, y:H-40, w:34, h:34, cb:()=>{ muteBounce=!muteBounce; save.muteBounce=muteBounce; persist(); }});
    scribbleText('🫧', W-61, H-22, 19, {alpha: muteBounce ? 0.25 : 0.6});
    if(muteBounce){ pencil(0.7, 2.2, '#d66969'); sketchLine(W-72, H-12, W-50, H-32, 881, 0.8); }
    uiButtons.push({x:W-38, y:H-40, w:34, h:34, cb:()=>{ muted=!muted; save.muted=muted; persist(); }});
    scribbleText(muted?'🔇':'🔊', W-21, H-22, 20, {alpha:0.6});
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* debug/test handle */
window.__bh = {
  get player(){return player}, get save(){return save}, get level(){return level},
  get state(){return state}, set state(v){state=v},
  get curLevel(){return curLevel},
  get paletteKey(){return paletteKey},
  get roundTime(){return roundTime},
  startRound, respawnAtBookmark, buildLevelRaw, tryOpenChest,
  LEVEL_DEFS, CHARACTERS, QUEST_SETS, ACTION_SETS,
  step(dt, n){ n = n||1; for(let i=0;i<n;i++) update(dt); }
};
</script>
